<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meeting · VideoNChat</title>
    <meta
      name="description"
      content="Join this VideoNChat meeting: video, audio, chat and screen sharing in your browser."
    />
    <meta name="theme-color" content="#0f1115" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VideoNChat" />
    <meta property="og:title" content="Join my VideoNChat meeting" />
    <meta
      property="og:description"
      content="Video, audio, chat and screen sharing in your browser. No downloads, no accounts."
    />
    <meta property="og:image" content="{{origin}}/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VideoNChat: video meetings in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/room.js"></script>
  </head>
  <body class="room-page" data-state="lobby">
    <a class="skip-link" href="#controls">Skip to call controls</a>

    <header class="topbar">
      <a class="brand" href="/" target="_blank" rel="noopener">
        <img class="brand__mark" src="/favicon.svg" alt="" width="28" height="28" />
        <span class="brand__name">VideoNChat</span>
        <span class="visually-hidden">(opens in a new tab)</span>
      </a>
      <div class="topbar__info">
        <button
          id="people-count"
          class="pill pill--button"
          type="button"
          aria-controls="people"
          aria-expanded="false"
        >
          <svg data-icon="users"></svg>
          <span class="visually-hidden">People:</span>
          <span id="participant-count">Joining…</span>
        </button>
        <span class="pill pill--quality" id="ping" role="status" data-quality="unknown">
          <svg data-icon="signal"></svg>
          <span id="ping-value">–</span>
        </span>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden>
      <span class="banner__text"></span>
      <button type="button" class="btn btn--secondary banner__action" hidden></button>
    </div>

    <main id="lobby" class="lobby" aria-labelledby="lobby-title">
      <section class="lobby__preview" aria-label="Your camera and microphone">
        <figure class="tile lobby__tile" data-self="true" data-video-off="true">
          <video
            id="lobby-video"
            class="tile__video tile__video--mirrored"
            autoplay
            playsinline
            muted
          ></video>
          <div class="tile__avatar" aria-hidden="true">
            <span class="tile__initials" id="lobby-initials">?</span>
          </div>
          <div class="lobby__toggles">
            <button id="lobby-mic" class="round-btn" type="button">
              <svg data-icon="mic"></svg>
            </button>
            <button id="lobby-camera" class="round-btn" type="button">
              <svg data-icon="video"></svg>
            </button>
            <button
              id="lobby-flip"
              class="round-btn"
              type="button"
              aria-label="Switch camera"
              title="Switch camera"
              hidden
            >
              <svg data-icon="switch-camera"></svg>
            </button>
          </div>
          <div class="meter" aria-hidden="true">
            <span id="mic-meter" class="meter__level"></span>
          </div>
        </figure>
        <div id="media-status" class="lobby__status" role="status" hidden>
          <p class="lobby__status-text"></p>
          <button id="media-retry" type="button" class="btn btn--secondary">Try again</button>
        </div>
      </section>

      <form id="lobby-form" class="lobby__form" novalidate>
        <h1 id="lobby-title">Ready to join?</h1>
        <p id="room-info" class="lobby__info" aria-live="polite">Checking who's here…</p>

        <div class="field-group">
          <label for="lobby-name">Your name</label>
          <input
            id="lobby-name"
            name="name"
            autocomplete="name"
            maxlength="40"
            required
            aria-describedby="name-hint name-error"
          />
          <p id="name-hint" class="field__hint">Shown to everyone in the meeting.</p>
          <p id="name-error" class="form-error" role="alert"></p>
        </div>

        <details class="devices">
          <summary>Camera, microphone and speaker</summary>
          <div class="field-group">
            <label for="lobby-videoinput">Camera</label>
            <select id="lobby-videoinput"></select>
          </div>
          <div class="field-group">
            <label for="lobby-audioinput">Microphone</label>
            <select id="lobby-audioinput"></select>
          </div>
          <div class="field-group">
            <label for="lobby-audiooutput">Speaker</label>
            <select id="lobby-audiooutput"></select>
          </div>
        </details>

        <button id="join-button" class="btn btn--primary btn--large" type="submit">Join now</button>
      </form>
    </main>

    <main class="room" hidden>
      <h1 class="visually-hidden">Meeting</h1>
      <section class="stage" aria-label="Participants">
        <div id="tiles" class="tiles" data-layout="grid" data-count="0" data-screens="0"></div>
      </section>

      <aside id="chat" class="panel chat" aria-labelledby="chat-heading">
        <header class="panel__header">
          <h2 id="chat-heading">Chat</h2>
          <button id="chat-close" class="icon-btn" type="button" aria-label="Close chat">
            <svg data-icon="x"></svg>
          </button>
        </header>
        <div class="chat__scroller">
          <ol id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ol>
        </div>
        <button id="chat-jump" class="btn btn--primary chat__jump" type="button" hidden>
          New messages ↓
        </button>
        <p id="typing" class="typing" aria-live="polite"></p>
        <form id="chat-form" class="composer">
          <label for="chat-input" class="visually-hidden">Message</label>
          <textarea
            id="chat-input"
            rows="1"
            maxlength="1000"
            placeholder="Send a message"
            autocomplete="off"
            aria-describedby="chat-counter"
          ></textarea>
          <button class="icon-btn icon-btn--accent" type="submit" aria-label="Send message">
            <svg data-icon="send"></svg>
          </button>
        </form>
        <p id="chat-counter" class="chat__counter" aria-live="polite"></p>
      </aside>

      <aside id="people" class="panel" aria-labelledby="people-heading">
        <header class="panel__header">
          <h2 id="people-heading">People</h2>
          <button id="people-close" class="icon-btn" type="button" aria-label="Close people">
            <svg data-icon="x"></svg>
          </button>
        </header>
        <ul id="people-list" class="people"></ul>
      </aside>
    </main>

    <nav id="controls" class="controls" aria-label="Call controls" tabindex="-1" hidden>
      <div class="controls__group">
        <button id="mic" class="control" type="button">
          <svg data-icon="mic"></svg>
          <span class="control__label">Mute</span>
        </button>
        <button id="camera" class="control" type="button">
          <svg data-icon="video"></svg>
          <span class="control__label">Stop video</span>
        </button>
        <button id="share" class="control" type="button">
          <svg data-icon="monitor-up"></svg>
          <span class="control__label">Present</span>
        </button>
      </div>
      <div class="controls__group">
        <button
          id="chat-toggle"
          class="control"
          type="button"
          aria-controls="chat"
          aria-expanded="false"
        >
          <svg data-icon="message-square"></svg>
          <span class="control__label">Chat</span>
          <span id="chat-unread" class="badge" hidden>New</span>
        </button>
        <button
          id="people-toggle"
          class="control"
          type="button"
          aria-controls="people"
          aria-expanded="false"
        >
          <svg data-icon="users"></svg>
          <span class="control__label">People</span>
        </button>
        <button id="invite" class="control" type="button">
          <svg data-icon="user-plus"></svg>
          <span class="control__label">Invite</span>
        </button>
        <button id="settings" class="control" type="button" aria-haspopup="dialog">
          <svg data-icon="settings"></svg>
          <span class="control__label">Settings</span>
        </button>
      </div>
      <button id="leave" class="control control--danger" type="button">
        <svg data-icon="phone-off"></svg>
        <span class="control__label">Leave</span>
      </button>
    </nav>

    <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title" class="dialog__title">Settings</h2>
        <div class="field-group">
          <label for="call-videoinput">Camera</label>
          <select id="call-videoinput"></select>
        </div>
        <div class="field-group">
          <label for="call-audioinput">Microphone</label>
          <select id="call-audioinput"></select>
        </div>
        <div class="field-group">
          <label for="call-audiooutput">Speaker</label>
          <select id="call-audiooutput"></select>
        </div>
        <div class="dialog__actions">
          <button id="show-shortcuts" class="btn btn--secondary" type="button">
            <svg data-icon="keyboard"></svg>
            Keyboard shortcuts
          </button>
          <button class="btn btn--primary" value="close">Done</button>
        </div>
      </form>
    </dialog>

    <dialog id="shortcuts-dialog" class="dialog" aria-labelledby="shortcuts-title">
      <form method="dialog">
        <h2 id="shortcuts-title" class="dialog__title">Keyboard shortcuts</h2>
        <dl id="shortcuts-list" class="shortcuts"></dl>
        <div class="dialog__actions">
          <button class="btn btn--primary" value="close">Close</button>
        </div>
      </form>
    </dialog>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="announcer" class="visually-hidden" aria-live="polite"></div>
  </body>
</html>
